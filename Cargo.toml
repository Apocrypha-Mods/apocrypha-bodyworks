[workspace]
resolver = "2"
members = ["crates/nif", "crates/bodyslide", "crates/save", "crates/plugin", "crates/character", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inflating what saves and plugins keep compressed.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# The add-on is downloaded: small matters more than the last bit of speed.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
